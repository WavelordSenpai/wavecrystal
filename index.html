<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaveCrystal</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;overflow:hidden}
  #main{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
  #crystalBox{width:300px;height:300px}
  canvas{display:block}
  .pill{background:#FFD700;color:#000;padding:10px 22px;border-radius:30px;font-weight:800;border:none;font-size:16px}
  .dark{background:#222;color:#fff;padding:12px 22px;border-radius:30px;border:none;font-size:16px;width:260px}
  .yellow{background:#FFD700;color:#000;padding:14px 22px;border-radius:30px;border:none;font-weight:800;font-size:17px;width:260px}
  .sub{color:#999;font-size:14px;line-height:1.6}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="main">
  <div id="crystalBox"></div>
  <div class="pill">ICOSAHEDRON • WATER</div>

  <!-- MINI BUTTON - THIS IS THE ONLY WAY BUBBLE APPEARS -->
  <button class="yellow" onclick="goMini()">↓ Mini Crystal</button>
  <button class="dark" onclick="toggleLock()">🔒 Lock</button>
  <button class="dark" onclick="startTimer()">▶ Start Timer</button>
  <button class="yellow" onclick="goMini()">↑ Back to App</button>

  <div class="sub">Your friend is with you.<br>Tap Mini, then press Home -<br>he is still spinning.</div>
</div>

<script>
  // MAIN APP CRYSTAL
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 3.2;
  const renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setSize(300, 300);
  renderer.setClearColor(0x000000, 0);
  document.getElementById('crystalBox').appendChild(renderer.domElement);

  const geo = new THREE.IcosahedronGeometry(1.2, 0);
  const mat = new THREE.MeshPhongMaterial({color:0x2196F3, shininess:100, specular:0x99ccff, flatShading:true});
  const crystal = new THREE.Mesh(geo, mat);
  scene.add(crystal);
  const wire = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0xFFD700}));
  scene.add(wire);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const l = new THREE.DirectionalLight(0xffffff, 1.2); l.position.set(2,3,4); scene.add(l);

  function animate(){
    requestAnimationFrame(animate);
    crystal.rotation.y += 0.01;
    crystal.rotation.x += 0.005;
    wire.rotation.copy(crystal.rotation);
    renderer.render(scene, camera);
  }
  animate();

  // MINI MODE - ONLY WAY TO GET BUBBLE
  function goMini() {
    if (window.AndroidMini) {
      window.AndroidMini.enableMini();
    } else {
      alert('Mini mode: press Home, crystal will follow you');
    }
  }

  function toggleLock(){ alert('Locked'); }
  function startTimer(){ alert('Timer started'); }
</script>
</body>
</html>
