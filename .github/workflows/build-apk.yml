name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if needed
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy overlay files into Android project
        run: |
          mkdir -p android/app/src/main/java/com/wavecrystal/app
          cp overlay/FloatingService.java android/app/src/main/java/com/wavecrystal/app/FloatingService.java
          cp overlay/MainActivity.java android/app/src/main/java/com/wavecrystal/app/MainActivity.java
          cp overlay/float_crystal.xml android/app/src/main/res/layout/float_crystal.xml
          cp overlay/bubble_bg.xml android/app/src/main/res/layout/bubble_bg.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wavecrystal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
