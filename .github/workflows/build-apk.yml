name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp icon.png www/ 2>/dev/null || true

      - name: Setup Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy overlay into Android project
        run: |
          mkdir -p android/app/src/main/java/com/wavecrystal/app
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          cp overlay/FloatingService.java android/app/src/main/java/com/wavecrystal/app/
          cp overlay/MainActivity.java android/app/src/main/java/com/wavecrystal/app/
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cat > android/app/src/main/res/layout/float_crystal.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="72dp"
              android:layout_height="72dp">
              <ImageView
                  android:id="@+id/crystalIcon"
                  android:layout_width="72dp"
                  android:layout_height="72dp"
                  android:src="@mipmap/ic_launcher"
                  android:background="@drawable/bubble_bg"
                  android:contentDescription="Wave Crystal" />
          </FrameLayout>
          EOF
          cat > android/app/src/main/res/drawable/bubble_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#CC7C4DFF" />
              <stroke android:width="2dp" android:color="#FFFFFF" />
          </shape>
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-crystal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
