name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Add Android
        run: npx cap add android
      - name: Copy Overlay Files
        run: |
          cp overlay/FloatingService.java android/app/src/main/java/com/wavecrystal/app/FloatingService.java
          cp overlay/MainActivity.java android/app/src/main/java/com/wavecrystal/app/MainActivity.java
          cp overlay/float_crystal.xml android/app/src/main/res/layout/float_crystal.xml
      - name: Add Overlay Permissions
        run: |
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          if 'SYSTEM_ALERT_WINDOW' not in t:
              t = t.replace('<uses-permission android:name=\"android.permission.INTERNET\" />', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />')
          if 'FloatingService' not in t:
              t = t.replace('</application>', '        <service android:name=\".FloatingService\" android:exported=\"false\" />\n    </application>')
          p.write_text(t)
          print('patched')
          "
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-crystal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
