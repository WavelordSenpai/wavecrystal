name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create www folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json || true
          cp sw.js www/sw.js || true
          cp icon.png www/icon.png || true

      - name: Add Android platform if needed
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copy overlay files into Android project
        run: |
          mkdir -p android/app/src/main/java/com/wavecrystal/app
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/assets
          cp overlay/FloatingService.java android/app/src/main/java/com/wavecrystal/app/FloatingService.java
          cp overlay/MainActivity.java android/app/src/main/java/com/wavecrystal/app/MainActivity.java
          cp overlay/float_crystal.xml android/app/src/main/res/layout/float_crystal.xml
          cp overlay/crystal.html android/app/src/main/assets/crystal.html

      - name: Force fix onResume visibility
        run: |
          sed -i 's/protected void onResume/public void onResume/' android/app/src/main/java/com/wavecrystal/app/MainActivity.java
          sed -i 's/protected void onActivityResult/public void onActivityResult/' android/app/src/main/java/com/wavecrystal/app/MainActivity.java

      - name: Add overlay permission to Manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q SYSTEM_ALERT_WINDOW $MANIFEST || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />|' $MANIFEST
          grep -q FloatingService $MANIFEST || sed -i 's|</application>|        <service android:name=".FloatingService" android:exported="false" />\n    </application>|' $MANIFEST
          cat $MANIFEST

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wavecrystal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
