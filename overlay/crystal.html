<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  #c { width:150px; height:150px; display:block; }
  #fallback { font-size:70px; display:none; text-align:center; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="fallback">⬢</div>
<script>
var shape = 'icosahedron';
try { shape = localStorage.getItem('wave_shape') || 'icosahedron'; } catch(e){}
var colorHex = 0x00C896;
try {
  var c = localStorage.getItem('wave_color');
  if(c) colorHex = parseInt(c);
} catch(e){}

if (typeof THREE === 'undefined') {
  document.getElementById('c').style.display = 'none';
  document.getElementById('fallback').style.display = 'block';
} else {
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 4.2;
  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), alpha: true, antialias: true });
  renderer.setSize(150, 150);

  var light1 = new THREE.PointLight(0xffffff, 1.2);
  light1.position.set(3, 3, 3);
  scene.add(light1);
  var light2 = new THREE.PointLight(0xD4AF37, 0.8);
  light2.position.set(-3, -2, 2);
  scene.add(light2);
  scene.add(new THREE.AmbientLight(0x888888, 1.2));

  var geo;
  if (shape === 'tetra') geo = new THREE.TetrahedronGeometry(1.5, 0);
  else if (shape === 'cube') geo = new THREE.BoxGeometry(1.9, 1.9, 1.9);
  else if (shape === 'octahedron') geo = new THREE.OctahedronGeometry(1.6, 0);
  else if (shape === 'dodecahedron') geo = new THREE.DodecahedronGeometry(1.5, 0);
  else geo = new THREE.IcosahedronGeometry(1.5, 0);

  var mat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.85, roughness: 0.25, flatShading: true });
  var mesh = new THREE.Mesh(geo, mat);
  var line = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xD4AF37 }));
  var group = new THREE.Group();
  group.add(mesh);
  group.add(line);
  scene.add(group);

  function animate() {
    requestAnimationFrame(animate);
    group.rotation.y += 0.01;
    group.rotation.x += 0.004;
    renderer.render(scene, camera);
  }
  animate();
}
</script>
</body>
</html>
