<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{margin:0;padding:0}html,body{background:transparent !important;overflow:hidden;width:100%;height:100%;display:flex;align-items:center;justify-content:center}#c{width:64px;height:64px;display:block;background:transparent !important}#fallback{font-size:40px;display:none}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body><canvas id="c"></canvas><div id="fallback">⬢</div>
<script>
var p = new URLSearchParams(location.search);
var shape = p.get('shape') || 'icosa';
var SOLIDS = {tetra:{color:0xE9B44C},cube:{color:0x1A1210},octa:{color:0x4CAF7D},dodeca:{color:0x7C5CBF},icosa:{color:0xE8833A}};
var colorHex = SOLIDS[shape] ? SOLIDS[shape].color : 0xE8833A;
var cParam = p.get('color');
if(cParam){ try{ colorHex = parseInt(cParam.replace('#',''),16); }catch(e){} }
if(typeof THREE==='undefined'){ document.getElementById('c').style.display='none'; document.getElementById('fallback').style.display='block'; }
else{
  var scene=new THREE.Scene(); var camera=new THREE.PerspectiveCamera(45,1,0.1,100); camera.position.z=4.2;
  var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),alpha:true,antialias:true}); renderer.setClearColor(0x000000,0); renderer.setSize(64,64);
  var l1=new THREE.PointLight(0xffffff,1.2); l1.position.set(3,3,3); scene.add(l1);
  var l2=new THREE.PointLight(0xD4AF37,0.8); l2.position.set(-3,-2,2); scene.add(l2);
  scene.add(new THREE.AmbientLight(0x888888,1.2));
  var geo;
  if(shape==='tetra') geo=new THREE.TetrahedronGeometry(1.5,0);
  else if(shape==='cube') geo=new THREE.BoxGeometry(1.9,1.9,1.9);
  else if(shape==='octa') geo=new THREE.OctahedronGeometry(1.6,0);
  else if(shape==='dodeca') geo=new THREE.DodecahedronGeometry(1.5,0);
  else geo=new THREE.IcosahedronGeometry(1.5,0);
  var mat=new THREE.MeshStandardMaterial({color:colorHex,metalness:0.85,roughness:0.25,flatShading:true});
  var mesh=new THREE.Mesh(geo,mat);
  var line=new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0xD4AF37}));
  var group=new THREE.Group(); group.add(mesh); group.add(line); scene.add(group);
  (function animate(){ requestAnimationFrame(animate); group.rotation.y+=0.008; group.rotation.x+=0.003; renderer.render(scene,camera); })();
}
</script></body></html>
